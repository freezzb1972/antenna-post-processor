[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (prefer explicit if/else in some cases)
    "N818",  # exception name should end with Error
]
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "ui/compiled",  # auto-generated by Qt Designer
    ".claude",
    "backup version",
    "CTIA Test plan",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "ui", "i18n"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = [
    "ui/compiled/",
    ".claude/",
    "build/",
    "dist/",
    "backup version/",
    "CTIA Test plan/",
]
[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "openpyxl.*",
    "numpy.*",
    "matplotlib.*",
]
ignore_missing_imports = true
